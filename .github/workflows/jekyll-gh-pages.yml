name: Deploy static GitHub Pages
on:
  push:
    branches: [main]
    paths: [index.html, 'en/**', 'assets/**', 'scripts/localize-site.cjs', 'tests/localization.test.cjs', 'extension/data/changelog.json', 'scripts/sync-release.cjs', 'tests/release.test.cjs', '.github/workflows/jekyll-gh-pages.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
      - name: Verify release rendering
        run: node --test tests/release.test.cjs tests/localization.test.cjs
      - name: Render the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          node scripts/sync-release.cjs --site-only --release-tag "$release_tag"
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/assets
          cp -R en _site/en
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
