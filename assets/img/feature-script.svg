<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="250"><stop offset="0%" stop-color="#13082a"/><stop offset="100%" stop-color="#0a0518"/></linearGradient>
    <linearGradient id="glow" x1="200" y1="40" x2="200" y2="210" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#d946ef"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" rx="16" fill="url(#bg)"/>

  <!-- Glow behind panel -->
  <ellipse cx="200" cy="125" rx="120" ry="80" fill="#8b5cf6" opacity=".15" filter="url(#blur)"/>

  <!-- Panel (dark UI) -->
  <rect x="70" y="45" width="260" height="160" rx="10" fill="#15102e" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity=".4"/>
  
  <!-- Panel title bar -->
  <rect x="70" y="45" width="260" height="32" rx="10" fill="#1c143d"/>
  <rect x="70" y="65" width="260" height="12" fill="#1c143d"/>
  <circle cx="88" cy="61" r="4" fill="#ff5f57"/>
  <circle cx="102" cy="61" r="4" fill="#febc2e"/>
  <circle cx="116" cy="61" r="4" fill="#28c840"/>
  <text x="200" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#8888a8">Script Launcher</text>

  <!-- File items with play buttons -->
  <!-- Item 1 -->
  <g transform="translate(90,92)">
    <rect width="140" height="28" rx="6" fill="#0d0820" stroke="#8b5cf633" stroke-width="1"/>
    <rect x="8" y="7" width="14" height="14" rx="3" fill="#8b5cf622"/>
    <path d="M11 14l5-3v6z" fill="#a78bfa"/>
    <text x="30" y="19" font-family="monospace" font-size="10" fill="#c8b8e8">render_queue.jsx</text>
    <!-- Play button -->
    <circle cx="124" cy="14" r="9" fill="url(#glow)" filter="url(#glow-filter)"/>
    <polygon points="121,9 121,19 129,14" fill="#fff"/>
  </g>

  <!-- Item 2 -->
  <g transform="translate(90,128)">
    <rect width="140" height="28" rx="6" fill="#0d0820" stroke="#8b5cf633" stroke-width="1"/>
    <rect x="8" y="7" width="14" height="14" rx="3" fill="#06b6d418"/>
    <path d="M11 14l5-3v6z" fill="#06b6d4"/>
    <text x="30" y="19" font-family="monospace" font-size="10" fill="#c8b8e8">batch_export.jsx</text>
    <circle cx="124" cy="14" r="9" fill="url(#glow)" filter="url(#glow-filter)"/>
    <polygon points="121,9 121,19 129,14" fill="#fff"/>
  </g>

  <!-- Item 3 -->
  <g transform="translate(90,164)">
    <rect width="140" height="28" rx="6" fill="#0d0820" stroke="#d946ef33" stroke-width="1"/>
    <rect x="8" y="7" width="14" height="14" rx="3" fill="#d946ef18"/>
    <path d="M11 14l5-3v6z" fill="#d946ef"/>
    <text x="30" y="19" font-family="monospace" font-size="10" fill="#c8b8e8">auto_key.jsxbin</text>
    <circle cx="124" cy="14" r="9" fill="url(#glow)" filter="url(#glow-filter)"/>
    <polygon points="121,9 121,19 129,14" fill="#fff"/>
  </g>

  <!-- Star decorations -->
  <g fill="#a78bfa" opacity=".35">
    <polygon points="340,55 342,60 347,61 343,64 344,69 340,66 336,69 337,64 333,61 338,60"/>
    <polygon points="58,210 59.5,213 63,214 60.5,216 61,219 58,217 55,219 55.5,216 53,214 56.5,213" opacity=".5"/>
  </g>

  <!-- Search bar hint -->
  <rect x="242" y="94" width="72" height="22" rx="11" fill="#0d0820" stroke="#ffffff12" stroke-width="1"/>
  <text x="278" y="109" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555570">🔍 搜索...</text>
</svg>
